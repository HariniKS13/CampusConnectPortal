<!DOCTYPE html>
<html>
<head>
    <title>Leave Application</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>SRI SHAKTHI INSTITUTE OF ENGINEERING AND TECHNOLOGY</h1>
    <h2>Leave Application</h2>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="bonafide.html">Bonafide</a>
    <a href="leave.html">Leave</a>
    <a href="notices.html">Notices</a>
</nav>

<section>

<h2>Apply for Leave</h2>

<form action="success.html">

<label>Student Name</label><br><br>
<input type="text" placeholder="Enter your name" required><br><br>

<label>Register Number</label><br><br>
<input type="text" placeholder="Enter Register Number" required><br><br>

<label>Department</label><br><br>
<select required>
    <option>Select Department</option>
    <option>CSE</option>
    <option>IT</option>
    <option>ECE</option>
    <option>EEE</option>
    <option>MECH</option>
    <option>CIVIL</option>
</select><br><br>

<label>Year</label><br><br>
<select required>
    <option>Select Year</option>
    <option>I Year</option>
    <option>II Year</option>
    <option>III Year</option>
    <option>IV Year</option>
</select><br><br>

<label>From Date</label><br><br>
<input type="date" required><br><br>

<label>To Date</label><br><br>
<input type="date" required><br><br>

<label>Reason</label><br><br>
<textarea rows="5" placeholder="Enter your reason" required></textarea><br><br>

<button type="submit">Submit Leave Request</button>

</form>

<br>

<a href="index.html">
    <button>Back to Home</button>
</a>

</section>

</footer>

</html>
