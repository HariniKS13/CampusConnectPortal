<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Leave Application</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<header>
    <h1>Sri Shakthi Institute of Engineering and Technology</h1>
</header>

<section>

    <h2>Leave Application Form</h2>

    <form action="/leave" method="post">

        <label>Student Name</label><br><br>
        <input type="text" name="studentName" required><br><br>

        <label>Register Number</label><br><br>
        <input type="text" name="regNo" required><br><br>

        <label>Department</label><br><br>
        <input type="text" name="department" required><br><br>

        <label>Year</label><br><br>
        <input type="text" name="year" required><br><br>

        <label>From Date</label><br><br>
        <input type="date" name="fromDate" required><br><br>

        <label>To Date</label><br><br>
        <input type="date" name="toDate" required><br><br>

        <label>Reason</label><br><br>
        <textarea name="reason" rows="5" placeholder="Enter your reason" required></textarea><br><br>

        <button type="submit">Submit Leave Request</button>

    </form>

    <br>

    <button type="button" onclick="window.location.href='/'">
        Back to Home
    </button>

</section>

<footer>
    <p>© 2026 Sri Shakthi Institute of Engineering and Technology</p>
</footer>

</body>
</html>
