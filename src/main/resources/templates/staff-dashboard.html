<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Dashboard - CampusConnect</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<header>
    <h1>CampusConnect</h1>
    <p>Sri Shakthi Institute of Engineering and Technology</p>
</header>

<nav>
    <a href="/">Home</a>
    <a href="/staff/login">Staff Login</a>
</nav>

<main class="container">

    <h1>Staff Dashboard</h1>

    <h2>Pending Student Requests</h2>

    <div th:if="${#lists.isEmpty(requests)}">
        <p>No pending requests.</p>
    </div>

    <div th:each="request : ${requests}" class="card">

        <hr>

        <h3 th:text="${request.requestType}">
            Request Type
        </h3>

        <p>
            <strong>Student Name:</strong>
            <span th:text="${request.studentName}"></span>
        </p>

        <p>
            <strong>Register Number:</strong>
            <span th:text="${request.regNo}"></span>
        </p>

        <p>
            <strong>Department:</strong>
            <span th:text="${request.department}"></span>
        </p>

        <p>
            <strong>Year:</strong>
            <span th:text="${request.year}"></span>
        </p>

        <p>
            <strong>Reason:</strong>
            <span th:text="${request.reason}"></span>
        </p>

        <div th:if="${request.requestType == 'LEAVE'}">

            <p>
                <strong>From Date:</strong>
                <span th:text="${request.fromDate}"></span>
            </p>

            <p>
                <strong>To Date:</strong>
                <span th:text="${request.toDate}"></span>
            </p>

        </div>

        <p>
            <strong>Status:</strong>
            <span th:text="${request.status}"></span>
        </p>

        <br>

        <!-- APPROVE -->
        <form action="/staff/approve" method="post">

            <input
                type="hidden"
                name="id"
                th:value="${request.id}">

            <button type="submit">
                Approve
            </button>

        </form>

        <br>

        <!-- REJECT -->
        <form action="/staff/reject" method="post">

            <input
                type="hidden"
                name="id"
                th:value="${request.id}">

            <button type="submit">
                Reject
            </button>

        </form>

    </div>

    <br>

    <button type="button" onclick="window.location.href='/'">
        Logout
    </button>

</main>

</body>
</html>
